<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Danganronpa : the fansite </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* base */
  body {
    margin: 0;
    background-color: #000000;
    color: #ccffcc;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
  }

  h1, h2, h3 { font-family: "Impact", "Arial Black", sans-serif; text-transform: uppercase; }
  h1 {
    font-size: 42px;
    color: #ff3399;
    text-shadow: 3px 3px 0 #3d95ec, 0 0 12px #ff00ff;
    letter-spacing: 3px;
    text-align: center;
    margin: 10px 0;
  }
  h2 {
    color: #ffff66;
    padding-bottom: 4px;
    text-shadow: 0 0 6px #ffff00;
  }
  h3 { color: #66ffcc; font-size: 18px; }

  /* Navigation */
  nav.hub {
    border: 2px outset #66ffcc;
    background: #110022;
    padding: 10px;
    text-align: center;
    margin-bottom: 12px;
  }
  nav.hub ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  nav.hub li {
    display: inline-block;
    margin: 4px 8px;
  }
  nav.hub a {
    color: #66ffcc;
    text-decoration: none;
  }
  nav.hub a:hover,
  nav.hub a.current {
    color: #ff3399;
    text-decoration: underline;
  }

  /* page views */
  .page { display: none; padding: 0 12px; }
  .page.active { display: block; }

  .box {
    border: 2px dashed #ff66cc;
    padding: 10px;
    margin: 10px 0;
    background: rgba(40, 0, 60, 0.4);
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .char {
    border: 2px groove #ffff66;
    padding: 8px;
    text-align: center;
    background: #050520;
  }
  table.guide {
    width: 100%;
    border-collapse: collapse;
  }
  table.guide td, table.guide th {
    border: 1px solid #6600cc;
    padding: 6px;
    vertical-align: top;
  }
  table.guide th { background: #330055; color: #ffff66; }

  .news-item { border-left: 4px solid #ff3399; padding-left: 8px; margin: 10px 0; }
  .news-date { color: #ffff66; font-size: 12px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .gallery div {
    border: 2px inset #66ffcc;
    background: linear-gradient(135deg, #220044, #002244);
    height: 90px;
    line-height: 90px;
    color: #ffcc66;
    font-size: 12px;
  }
</style>
</head>
<body>

  <!-- HUB -->
  <nav class="hub">
    <ul id="navlinks">
      <li><a href="#home">Homepage</a></li>
      <li><a href="#info">Info and such about website</a></li>
      <li><a href="#story">The story of Danganronpa</a></li>
      <li><a href="#guides">Guides for the game</a></li>
      <li><a href="#cast">Character cast</a></li>
      <li><a href="#news">News, facts, gallery</a></li>
      <li><a href="#credits">Credits</a></li>
    </ul>
  </nav>

  <!-- HOMEPAGE -->
  <section id="home" class="page">
    <h2>brapzillion</h2>
    <div class="box">
      <p>brapzillion</p>
    </div>
  </section>

  <!-- INFO ABOUT WEBSITE -->
  <section id="info" class="page">
    <h2>Brapzillion</h2>
  </section>

  <!-- STORY -->
  <section id="story" class="page">
    <h2>Brapzillion</h2>
  </section>

  <!-- GUIDES -->
  <section id="guides" class="page">
    <h2>Brapzillion</h2>
  </section>

  <!-- CAST -->
  <section id="cast" class="page">
    <h2>Brapzillion</h2>
  </section>

  <!-- NEWS / FACTS / GALLERY -->
  <section id="news" class="page">
    <h2>Brapzillion</h2>
  </section>

  <!-- CREDITS -->
  <section id="credits" class="page">
    <h2>Credits</h2>
  </section>

  <!-- FORMS -->
  <div class="box">
    <h3>Brapzillion</h3>
  </div>

<script>
  const pages = document.querySelectorAll('.page');
  const links = document.querySelectorAll('#navlinks a');

  function showPage(id) {
    const target = document.getElementById(id) || document.getElementById('home');

    pages.forEach(p => p.classList.toggle('active', p === target));
    links.forEach(a => a.classList.toggle('current', a.getAttribute('href') === '#' + target.id));
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));
  window.addEventListener('DOMContentLoaded', () => showPage(location.hash.slice(1)));
</script>

</body>
</html>
